name: Build Gemini APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Show error in run summary
        if: failure()
        run: |
          {
            echo '## Build failed - last 80 log lines'
            echo '```'
            if [ -f "$RUNNER_TEMP/build.log" ]; then tail -n 80 "$RUNNER_TEMP/build.log"; else echo 'no build log (failed before the SDK/Gradle steps)'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
